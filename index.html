<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UAH Exchange Rates</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===================== HOME VIEW ===================== -->
  <section id="view-home">
    <div class="hero text-center">
      <h1 id="home-date" class="hero-date">&nbsp;</h1>
      <div class="hero-line"></div>
      <p class="hero-subtitle">All currencies quoted against the hryvnia (UAH)</p>
    </div>

    <div class="container content-wrap">
      <div class="card shadow-sm rates-card">
        <div class="card-body p-4">
          <div id="home-loading" class="text-center py-5 d-none">
            <div class="spinner-border text-primary" role="status"></div>
            <div class="mt-2 text-muted">Loading rates from NBU...</div>
          </div>
          <div id="home-error" class="alert alert-danger d-none" role="alert"></div>

          <div class="table-responsive">
            <table class="table table-hover align-middle rates-table mb-0" id="rates-table">
              <thead>
                <tr>
                  <th colspan="2">Currency</th>
                  <th></th>
                  <th class="text-end">Spot (UAH)</th>
                  <th class="text-center">Chart</th>
                </tr>
              </thead>
              <tbody id="rates-body"></tbody>
            </table>
          </div>
          <p class="source-note mt-3 mb-0">Source: National Bank of Ukraine (bank.gov.ua)</p>
        </div>
      </div>
    </div>
  </section>

  <!-- ===================== DETAIL VIEW ===================== -->
  <section id="view-detail" class="d-none">
    <div class="detail-top">
      <div class="container">
        <div class="d-flex justify-content-between align-items-center py-4">
          <h1 id="detail-title" class="detail-title mb-0"></h1>
          <a href="#/" class="btn btn-outline-primary">&larr; Back to all currencies</a>
        </div>
      </div>
    </div>

    <div class="container content-wrap-detail">
      <div class="card shadow-sm">
        <!-- summary band -->
        <div class="summary-band p-4">
          <div class="row g-3">
            <div class="col-lg-5">
              <div id="summary-date" class="summary-date"></div>
              <div id="summary-rate" class="summary-rate"></div>
            </div>
            <div class="col-lg-7">
              <div id="summary-period" class="summary-period-title"></div>
              <hr class="my-2">
              <div class="row text-start">
                <div class="col-4">
                  <div class="stat-label" id="stat-min-label">Min</div>
                  <div class="stat-value" id="stat-min">-</div>
                </div>
                <div class="col-4">
                  <div class="stat-label" id="stat-max-label">Max</div>
                  <div class="stat-value" id="stat-max">-</div>
                </div>
                <div class="col-4">
                  <div class="stat-label">Average</div>
                  <div class="stat-value" id="stat-avg">-</div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- controls -->
        <div class="card-body p-4">
          <form id="filter-form" class="row g-3 align-items-end" novalidate>
            <div class="col-md-3">
              <label for="currency-select" class="form-label">Currency</label>
              <select id="currency-select" class="form-select"></select>
            </div>
            <div class="col-md-3 col-6">
              <label for="start-date" class="form-label">Start</label>
              <input type="date" id="start-date" class="form-control">
            </div>
            <div class="col-md-3 col-6">
              <label for="end-date" class="form-label">End</label>
              <input type="date" id="end-date" class="form-control">
            </div>
            <div class="col-md-3 d-grid">
              <button type="submit" id="chart-btn" class="btn btn-primary">Chart</button>
            </div>
          </form>

          <div class="mt-3 d-flex align-items-center gap-2 flex-wrap">
            <span class="text-muted me-1">Zoom:</span>
            <button type="button" class="btn btn-light btn-sm preset-btn" data-days="30">1m</button>
            <button type="button" class="btn btn-light btn-sm preset-btn" data-days="182">6m</button>
            <button type="button" class="btn btn-light btn-sm preset-btn" data-days="365">1y</button>
          </div>

          <div id="detail-error" class="alert alert-danger mt-3 mb-0 d-none" role="alert"></div>

          <div class="chart-wrap mt-4 position-relative">
            <div id="detail-loading" class="chart-loading d-none">
              <div class="spinner-border text-primary" role="status"></div>
            </div>
            <canvas id="rate-chart"></canvas>
          </div>
          <p class="source-note mt-3 mb-0">Source: National Bank of Ukraine (bank.gov.ua)</p>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
